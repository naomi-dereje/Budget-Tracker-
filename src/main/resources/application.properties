# ===================================================================
# Student Budget Tracker - Application Properties (Base)
# ===================================================================

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
spring.application.name=student-budget-tracker
spring.profiles.default=mysql

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Security & Session Settings
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Logging
logging.level.com.tracker.budget=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
