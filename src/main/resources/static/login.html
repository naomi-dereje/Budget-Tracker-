<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Budget Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
            padding: 24px;
        }
        [data-theme="dark"] .auth-page {
            background: linear-gradient(135deg, #0B0F19 0%, #171E38 100%);
        }
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 36px;
            box-shadow: var(--shadow-xl);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .alert-box {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error {
            background: var(--danger-light);
            border: 1px solid var(--danger-border);
            color: var(--danger);
        }
        .alert-success {
            background: var(--success-light);
            border: 1px solid var(--success-border);
            color: var(--success);
        }
        .demo-box {
            margin-top: 24px;
            padding: 14px;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            font-size: 13px;
            text-align: center;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <div class="brand-icon">🎓</div>
                <div style="text-align: left;">
                    <div class="brand-title">BudgetTracker</div>
                    <div class="brand-subtitle">University Edition</div>
                </div>
            </div>
            <h2 style="font-size: 22px; font-weight: 700;">Welcome back</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Sign in to your student finance account</p>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="email">University Email</label>
                <input type="email" id="email" class="form-input" placeholder="e.g. alex.student@campus.edu" required autocomplete="email">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                </div>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
                Sign In
            </button>
        </form>

        <div class="demo-box">
            <p style="color: var(--text-secondary); margin-bottom: 8px;"><strong>Portfolio Demo Credentials:</strong></p>
            <p style="font-family: monospace; font-size: 12px; color: var(--text-muted);">alex.student@campus.edu / Student123!</p>
            <button type="button" id="fill-demo-btn" class="btn btn-secondary btn-sm" style="margin-top: 10px; width: 100%;">
                ⚡ Auto-fill Demo Account
            </button>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
            Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Create Student Account</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const alertBox = document.getElementById('alert-box');

            if (params.get('registered') === 'true') {
                showAlert('Account registered successfully! Please log in.', 'success');
            } else if (params.get('logged_out') === 'true') {
                showAlert('You have been logged out securely.', 'success');
            } else if (params.get('session') === 'expired') {
                showAlert('Your session has expired. Please sign in again.', 'error');
            }

            // Demo auto-fill
            document.getElementById('fill-demo-btn').addEventListener('click', () => {
                document.getElementById('email').value = 'alex.student@campus.edu';
                document.getElementById('password').value = 'Student123!';
            });

            // Handle login
            const form = document.getElementById('login-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const submitBtn = document.getElementById('submit-btn');

                submitBtn.disabled = true;
                submitBtn.textContent = 'Authenticating...';

                try {
                    const res = await API.post('/api/auth/login', { email, password });
                    if (res && res.success) {
                        showToast('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '/dashboard.html';
                        }, 500);
                    } else {
                        showAlert(res.message || 'Login failed. Please check credentials.', 'error');
                    }
                } catch (err) {
                    showAlert(err.message || 'Unable to log in. Please verify your credentials.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });

            function showAlert(msg, type) {
                alertBox.textContent = msg;
                alertBox.className = `alert-box alert-${type}`;
                alertBox.style.display = 'block';
            }

            function hideAlert() {
                alertBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
