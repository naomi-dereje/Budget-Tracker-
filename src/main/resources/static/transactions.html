<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | Student Budget Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">🎓</div>
                <div>
                    <div class="brand-title">BudgetTracker</div>
                    <div class="brand-subtitle">Student Edition</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="/dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a href="/transactions.html" class="nav-item active">
                    <span class="nav-icon">💳</span> Transactions
                </a>
                <a href="/budgets.html" class="nav-item">
                    <span class="nav-icon">🎯</span> Monthly Budgets
                </a>
                <a href="/categories.html" class="nav-item">
                    <span class="nav-icon">🏷️</span> Categories
                </a>
                <a href="/reports.html" class="nav-item">
                    <span class="nav-icon">📈</span> Financial Reports
                </a>
                <a href="/profile.html" class="nav-item">
                    <span class="nav-icon">⚙️</span> Settings & Profile
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-snippet">
                    <div class="user-avatar js-user-avatar">ST</div>
                    <div>
                        <div class="user-name-snippet js-user-name">Loading...</div>
                        <div class="user-univ-snippet js-user-univ">University</div>
                    </div>
                </div>
                <button type="button" class="btn-icon" title="Logout" onclick="handleLogout()">🚪</button>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header class="topbar">
                <div class="topbar-left">
                    <button type="button" id="menu-toggle" class="btn-icon menu-toggle" style="display: none;">☰</button>
                    <h1 class="page-title">Transaction Records</h1>
                </div>

                <div class="topbar-actions">
                    <button type="button" id="theme-toggle-btn" class="btn-icon" title="Toggle theme">🌙</button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="exportTransactionsCSV()">
                        📥 Export CSV
                    </button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="openAddModal()">
                        + New Transaction
                    </button>
                </div>
            </header>

            <main class="content-body">
                <!-- Filters & Search Bar -->
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-body" style="padding: 16px 20px;">
                        <form id="filter-form" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto; gap: 12px; align-items: end;">
                            <div>
                                <label class="form-label" style="font-size: 12px;">Search Description</label>
                                <input type="text" id="filter-search" class="form-input" placeholder="e.g. groceries, rent, tutor">
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px;">Transaction Type</label>
                                <select id="filter-type" class="form-select">
                                    <option value="">All Types</option>
                                    <option value="EXPENSE">Expenses Only</option>
                                    <option value="INCOME">Income Only</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px;">Category</label>
                                <select id="filter-category" class="form-select">
                                    <option value="">All Categories</option>
                                </select>
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px;">Start Date</label>
                                <input type="date" id="filter-start-date" class="form-input">
                            </div>
                            <div>
                                <label class="form-label" style="font-size: 12px;">End Date</label>
                                <input type="date" id="filter-end-date" class="form-input">
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <button type="submit" class="btn btn-primary" style="height: 40px;">Filter</button>
                                <button type="button" id="clear-filters-btn" class="btn btn-secondary" style="height: 40px;">Reset</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Transactions Data Table -->
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Category</th>
                                        <th>Description</th>
                                        <th>Type</th>
                                        <th style="text-align: right;">Amount</th>
                                        <th style="text-align: center;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="transactions-tbody">
                                    <tr>
                                        <td colspan="6" style="text-align: center; padding: 36px; color: var(--text-muted);">Loading transactions...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination Footer -->
                        <div style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-color); flex-wrap: wrap; gap: 12px;">
                            <span id="pagination-info" style="font-size: 13px; color: var(--text-muted);">Showing 0 of 0 records</span>
                            <div style="display: flex; gap: 8px;">
                                <button type="button" id="prev-page-btn" class="btn btn-secondary btn-sm" disabled>Previous</button>
                                <span id="current-page-badge" class="badge badge-neutral" style="padding: 6px 14px; font-size: 13px;">Page 1</span>
                                <button type="button" id="next-page-btn" class="btn btn-secondary btn-sm" disabled>Next</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add / Edit Transaction Modal -->
    <div id="tx-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">Record Transaction</h3>
                <button type="button" class="modal-close" onclick="closeModal('tx-modal')">×</button>
            </div>
            <form id="tx-form">
                <input type="hidden" id="edit-tx-id">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <div style="display: flex; gap: 12px;">
                            <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">
                                <input type="radio" name="modalTxType" value="EXPENSE" checked onchange="handleModalTypeChange()"> 💸 Expense
                            </label>
                            <label style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">
                                <input type="radio" name="modalTxType" value="INCOME" onchange="handleModalTypeChange()"> 💰 Income
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="form-amount">Amount</label>
                        <input type="number" id="form-amount" class="form-input" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="form-category">Category</label>
                        <select id="form-category" class="form-select" required>
                            <option value="">Select Category...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="form-desc">Description</label>
                        <input type="text" id="form-desc" class="form-input" placeholder="e.g. Physics Textbook, Student Union Fee" required maxlength="255">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="form-date">Transaction Date</label>
                        <input type="date" id="form-date" class="form-input" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('tx-modal')">Cancel</button>
                    <button type="submit" id="form-submit-btn" class="btn btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/transactions.js"></script>
</body>
</html>
