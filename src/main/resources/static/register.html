<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Budget Tracker</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F8FAFC 0%, #EEF2FF 100%);
            padding: 32px 16px;
        }
        [data-theme="dark"] .auth-page {
            background: linear-gradient(135deg, #0B0F19 0%, #171E38 100%);
        }
        .auth-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            padding: 36px;
            box-shadow: var(--shadow-xl);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .alert-box {
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            background: var(--danger-light);
            border: 1px solid var(--danger-border);
            color: var(--danger);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 540px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <div class="brand-icon">🎓</div>
                <div style="text-align: left;">
                    <div class="brand-title">BudgetTracker</div>
                    <div class="brand-subtitle">University Edition</div>
                </div>
            </div>
            <h2 style="font-size: 22px; font-weight: 700;">Create Student Account</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Start managing your semester expenses in seconds</p>
        </div>

        <div id="alert-box" class="alert-box"></div>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-input" placeholder="e.g. Alex Mercer" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">University Email</label>
                <input type="email" id="email" class="form-input" placeholder="e.g. alex.student@campus.edu" required autocomplete="email">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="university">University / College</label>
                    <input type="text" id="university" class="form-input" placeholder="e.g. State University">
                </div>
                <div class="form-group">
                    <label class="form-label" for="currencySymbol">Currency Symbol</label>
                    <select id="currencySymbol" class="form-select">
                        <option value="$" selected>$ (USD / CAD / AUD)</option>
                        <option value="€">€ (EUR)</option>
                        <option value="£">£ (GBP)</option>
                        <option value="¥">¥ (JPY / CNY)</option>
                        <option value="₹">₹ (INR)</option>
                        <option value="₱">₱ (PHP)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="monthlyBudgetBaseline">Estimated Monthly Budget Target</label>
                <input type="number" id="monthlyBudgetBaseline" class="form-input" placeholder="e.g. 1000.00" step="0.01" min="0" value="1000.00">
                <span class="form-help">You can customize this anytime on the Budgets page.</span>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary);">
            Already have an account? <a href="/login.html" style="font-weight: 600;">Sign in here</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            const alertBox = document.getElementById('alert-box');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.style.display = 'none';

                const fullName = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const university = document.getElementById('university').value.trim();
                const currencySymbol = document.getElementById('currencySymbol').value;
                const monthlyBudgetBaseline = parseFloat(document.getElementById('monthlyBudgetBaseline').value) || 0;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    alertBox.textContent = 'Passwords do not match. Please verify.';
                    alertBox.style.display = 'block';
                    return;
                }

                const submitBtn = document.getElementById('submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating account...';

                try {
                    const payload = {
                        fullName,
                        email,
                        university,
                        currencySymbol,
                        monthlyBudgetBaseline,
                        password
                    };

                    const res = await API.post('/api/auth/register', payload);
                    if (res && res.success) {
                        showToast('Account created! Redirecting to login...', 'success');
                        setTimeout(() => {
                            window.location.href = '/login.html?registered=true';
                        }, 800);
                    } else {
                        alertBox.textContent = res.message || 'Registration failed.';
                        alertBox.style.display = 'block';
                    }
                } catch (err) {
                    alertBox.textContent = err.message || 'Unable to register. Please check details.';
                    alertBox.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            });
        });
    </script>
</body>
</html>
